<svg xmlns="http://www.w3.org/2000/svg" width="780" height="150" viewBox="0 0 780 150">
  <defs>
    <filter id="bShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f89820"/><stop offset="100%" stop-color="#ed8b00"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3776ab"/><stop offset="50%" stop-color="#ffd43b"/><stop offset="100%" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3178c6"/><stop offset="100%" stop-color="#235a97"/>
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/><stop offset="100%" stop-color="#20a8ca"/>
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2496ed"/><stop offset="100%" stop-color="#1368a0"/>
    </linearGradient>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6db33f"/><stop offset="100%" stop-color="#4a8a2a"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc382d"/><stop offset="100%" stop-color="#a0281f"/>
    </linearGradient>
    <linearGradient id="mysqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00758f"/><stop offset="100%" stop-color="#f29111"/>
    </linearGradient>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791"/><stop offset="100%" stop-color="#254a6e"/>
    </linearGradient>
  </defs>

  <!-- 第一行 6个 -->
  <g font-family="'Segoe UI',sans-serif" font-size="14" font-weight="600" filter="url(#bShadow)">
    <rect x="10"  y="15" width="100" height="50" rx="12" fill="url(#javaGrad)"/>
    <text x="60"  y="47" fill="#ffffff" text-anchor="middle">Java</text>

    <rect x="125" y="15" width="110" height="50" rx="12" fill="url(#pyGrad)"/>
    <text x="180" y="47" fill="#ffffff" text-anchor="middle">Python</text>

    <rect x="250" y="15" width="130" height="50" rx="12" fill="url(#tsGrad)"/>
    <text x="315" y="47" fill="#ffffff" text-anchor="middle">TypeScript</text>

    <rect x="395" y="15" width="110" height="50" rx="12" fill="url(#reactGrad)"/>
    <text x="450" y="47" fill="#20232a" text-anchor="middle">React</text>

    <rect x="520" y="15" width="110" height="50" rx="12" fill="url(#dockerGrad)"/>
    <text x="575" y="47" fill="#ffffff" text-anchor="middle">Docker</text>

    <rect x="645" y="15" width="125" height="50" rx="12" fill="url(#springGrad)"/>
    <text x="707" y="47" fill="#ffffff" text-anchor="middle">Spring Boot</text>
  </g>

  <!-- 第二行 5个 -->
  <g font-family="'Segoe UI',sans-serif" font-size="14" font-weight="600" filter="url(#bShadow)">
    <rect x="10"  y="85" width="115" height="50" rx="12" fill="url(#aiGrad)"/>
    <text x="67"  y="117" fill="#ffffff" text-anchor="middle">Spring AI</text>

    <rect x="140" y="85" width="115" height="50" rx="12" fill="url(#lgGrad)"/>
    <text x="197" y="117" fill="#ffffff" text-anchor="middle">LangGraph</text>

    <rect x="270" y="85" width="95"  height="50" rx="12" fill="url(#redisGrad)"/>
    <text x="317" y="117" fill="#ffffff" text-anchor="middle">Redis</text>

    <rect x="380" y="85" width="100" height="50" rx="12" fill="url(#mysqlGrad)"/>
    <text x="430" y="117" fill="#ffffff" text-anchor="middle">MySQL</text>

    <rect x="495" y="85" width="120" height="50" rx="12" fill="url(#pgGrad)"/>
    <text x="555" y="117" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
  </g>
</svg>
